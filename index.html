<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GHANA WTF?! Challenge</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      text-align: center;
    }

    .flag {
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
    }

    .subtitle {
      color: #ccc;
      margin: 8px 0 30px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .play {
      background: #f5c400;
      color: #111;
    }

    .secondary {
      background: #292929;
      color: white;
    }

    .card {
      background: #1d1d1d;
      padding: 22px;
      border-radius: 18px;
      margin-top: 20px;
    }

    .timer {
      font-size: 28px;
      font-weight: bold;
      margin: 12px;
    }

    .question {
      font-size: 21px;
      line-height: 1.4;
      margin: 20px 0;
    }

    .answer {
      background: #292929;
      color: white;
      text-align: left;
    }

    .answer:hover {
      background: #3a3a3a;
    }

    .hidden {
      display: none;
    }

    .score {
      font-size: 50px;
      font-weight: bold;
      color: #f5c400;
    }

    .code {
      background: #292929;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

<div class="app">

  <div id="home">
    <div class="flag">🇬🇭</div>
    <h1>GHANA WTF?!</h1>
    <p class="subtitle">Can you beat the challenge?</p>

    <button class="play" onclick="startBirthday()">
      🎂 BIRTHDAY CHALLENGE
    </button>

    <button class="secondary" onclick="showReferral()">
      👥 INVITE FRIENDS
    </button>

    <button class="secondary" onclick="showLeaderboard()">
      🏆 LEADERBOARD
    </button>
  </div>

  <div id="codeScreen" class="hidden">
    <div class="card">
      <h2>🎂 Birthday Challenge</h2>
      <p>Enter the birthday code to play.</p>

      <input
        id="birthdayCode"
        class="code"
        placeholder="Enter code"
        style="width:100%;border:0;color:white;text-align:center;"
      >

      <button class="play" onclick="checkCode()">
        ENTER CHALLENGE
      </button>

      <button class="secondary" onclick="goHome()">
        BACK
      </button>
    </div>
  </div>

  <div id="game" class="hidden">
    <div class="card">
      <div id="progress"></div>
      <div class="timer" id="timer">30</div>
      <div class="question" id="question"></div>
      <div id="answers"></div>
    </div>
  </div>

  <div id="result" class="hidden">
    <div class="card">
      <h2>🎉 Challenge Complete!</h2>

      <div class="score" id="finalScore">0</div>

      <p>Your score</p>

      <button class="play" onclick="shareChallenge()">
        ⚔️ CHALLENGE A FRIEND
      </button>

      <button class="secondary" onclick="showReferral()">
        👥 INVITE FRIENDS
      </button>

      <button class="secondary" onclick="goHome()">
        🏠 HOME
      </button>
    </div>
  </div>

  <div id="referral" class="hidden">
    <div class="card">
      <h2>👥 INVITE FRIENDS</h2>
      <p>Challenge your friends and grow your referral count.</p>

      <div class="code" id="refLink"></div>

      <button class="play" onclick="copyReferral()">
        📋 COPY LINK
      </button>

      <button class="secondary" onclick="shareChallenge()">
        📤 SHARE
      </button>

      <button class="secondary" onclick="goHome()">
        BACK
      </button>
    </div>
  </div>

  <div id="leaderboard" class="hidden">
    <div class="card">
      <h2>🏆 LEADERBOARD</h2>
      <p>Birthday Challenge</p>
      <p>🥇 Coming soon...</p>

      <button class="secondary" onclick="goHome()">
        BACK
      </button>
    </div>
  </div>

</div>

<script>

const BIRTHDAY_CODE = "longthingbirthday";

const questions = [
  {
    q: "Which Ghanaian lake was formed by a meteorite impact?",
    a: ["Lake Volta", "Lake Bosumtwi", "Lake Chad", "Lake Victoria"],
    correct: 1
  },
  {
    q: "What is the capital city of Ghana?",
    a: ["Kumasi", "Tema", "Accra", "Cape Coast"],
    correct: 2
  },
  {
    q: "Which country was formerly known as the Gold Coast?",
    a: ["Ghana", "Nigeria", "Togo", "Benin"],
    correct: 0
  },
  {
    q: "What is Ghana's currency?",
    a: ["Naira", "Cedi", "Dalasi", "Franc"],
    correct: 1
  },
  {
    q: "Which ocean borders Ghana?",
    a: ["Atlantic Ocean", "Indian Ocean", "Pacific Ocean", "Arctic Ocean"],
    correct: 0
  },
  {
    q: "Which city is famous for Ghana's Cape Coast Castle?",
    a: ["Tamale", "Cape Coast", "Ho", "Sunyani"],
    correct: 1
  },
  {
    q: "What are Ghana's national colours?",
    a: ["Red, Yellow and Green", "Blue, White and Red", "Black, White and Green", "Yellow, Blue and Green"],
    correct: 0
  },
  {
    q: "Which Ghanaian food is commonly made from fermented corn dough?",
    a: ["Fufu", "Banku", "Waakye", "Kenkey"],
    correct: 3
  },
  {
    q: "Which is Ghana's largest artificial lake?",
    a: ["Lake Bosumtwi", "Lake Volta", "Lake Chad", "Lake Victoria"],
    correct: 1
  },
  {
    q: "What does 'WTF?!' represent in this game?",
    a: ["World Trivia Fun", "Wow That's Funny", "Ghana WTF?!", "Win The Fight"],
    correct: 2
  }
];

let current = 0;
let score = 0;
let timer;
let timeLeft = 30;

function hideAll() {
  document.querySelectorAll(".app > div").forEach(x => {
    x.classList.add("hidden");
  });
}

function goHome() {
  hideAll();
  document.getElementById("home").classList.remove("hidden");
}

function startBirthday() {
  hideAll();
  document.getElementById("codeScreen").classList.remove("hidden");
}

function checkCode() {
  const code = document.getElementById("birthdayCode").value.trim();

  if (code !== BIRTHDAY_CODE) {
    alert("❌ Wrong birthday code.");
    return;
  }

  current = 0;
  score = 0;

  hideAll();
  document.getElementById("game").classList.remove("hidden");

  showQuestion();
}

function showQuestion() {
  clearInterval(timer);

  const q = questions[current];

  document.getElementById("progress").textContent =
    `Question ${current + 1} of ${questions.length}`;

  document.getElementById("question").textContent = q.q;

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  q.a.forEach((answer, index) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = answer;
    button.onclick = () => answerQuestion(index);
    answers.appendChild(button);
  });

  timeLeft = 30;
  document.getElementById("timer").textContent = timeLeft;

  timer = setInterval(() => {
    timeLeft--;
    document.getElementById("timer").textContent = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timer);
      nextQuestion();
    }
  }, 1000);
}

function answerQuestion(index) {
  clearInterval(timer);

  if (index === questions[current].correct) {
    score++;
  }

  nextQuestion();
}

function nextQuestion() {
  current++;

  if (current >= questions.length) {
    finishGame();
  } else {
    showQuestion();
  }
}

function finishGame() {
  clearInterval(timer);

  hideAll();
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("finalScore").textContent =
    `${score}/10`;
}

function showReferral() {
  hideAll();

  document.getElementById("referral").classList.remove("hidden");

  const username = "GHANAWTFChallengeBot";

  document.getElementById("refLink").textContent =
    `https://t.me/${username}?start=REF`;
}

function copyReferral() {
  const text = document.getElementById("refLink").textContent;

  navigator.clipboard.writeText(text);

  alert("✅ Referral link copied!");
}

function shareChallenge() {
  const text =
    "🔥 I just played the GHANA WTF?! Challenge! Can you beat my score? 🇬🇭";

  const url =
    "https://t.me/GHANAWTFChallengeBot";

  window.open(
    "https://t.me/share/url?url=" +
    encodeURIComponent(url) +
    "&text=" +
    encodeURIComponent(text),
    "_blank"
  );
}

function showLeaderboard() {
  hideAll();
  document.getElementById("leaderboard").classList.remove("hidden");
}

</script>

</body>
        </html>
